services:
  server:
    build: .
    image: ripws
    container_name: ripws-server
    networks: [ripws-net]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ROLE: server
      MODE: kernel
      TUN_ADDR: 10.7.0.1/24
      LISTEN: ":8080"
      CONFIG: /cfg/server.json
      NAT_ROUTES: "1.1.1.1/32,8.8.8.8/32"
      NAT_CLIENT_IP: "10.7.0.2"
    volumes:
      - ./config:/cfg:ro
    restart: "no"

  client:
    build: .
    image: ripws
    container_name: ripws-client
    networks: [ripws-net]
    depends_on: [server]
    environment:
      ROLE: client
      MODE: userspace
      US_ADDR: 10.7.0.2
      US_ROUTE: 10.7.0.0/24
      US_NAT: "1"
      URL: ws://server:8080/${RIPWS_UUID}
      PSK: "${RIPWS_PSK}"
      PING_INTERVAL: 30s
    restart: "no"

networks:
  ripws-net:
    driver: bridge
