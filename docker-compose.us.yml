services:
  server:
    build: .
    image: ripws
    container_name: ripws-server
    networks: [ripws-net]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ROLE: server
      MODE: kernel
      TUN_ADDR: 10.8.0.1/24
      LISTEN: ":8080"
      CONFIG: /cfg/server.json
      IPERF3: 10.8.0.1
    volumes:
      - ./config:/cfg:ro
    restart: "no"

  client:
    build: .
    image: ripws
    container_name: ripws-client
    networks: [ripws-net]
    depends_on: [server]
    environment:
      ROLE: client
      MODE: userspace
      US_ADDR: 10.8.0.2
      US_ROUTE: 10.8.0.0/24
      US_PING: 10.8.0.1
      US_PING_COUNT: "10"
      US_FORWARD: "0.0.0.0:5201=10.8.0.1:5201"
      US_UDP_FORWARD: "0.0.0.0:5201=10.8.0.1:5201"
      URL: ws://server:8080/${RIPWS_UUID}
      PSK: "${RIPWS_PSK}"
      PING_INTERVAL: 30s
    restart: "no"

networks:
  ripws-net:
    driver: bridge
