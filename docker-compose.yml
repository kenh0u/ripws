services:
  server:
    build: .
    image: ripws
    container_name: ripws-server
    networks: [ripws-net]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ROLE: server
      MODE: kernel
      TUN_ADDR: 10.7.0.1/24
      LISTEN: "8080"
      PSK: "${RIPWS_PSK}"
      UUID: "${RIPWS_UUID}"
      IPERF3: 10.7.0.1
    restart: "no"

  client:
    build: .
    image: ripws
    container_name: ripws-client
    networks: [ripws-net]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on: [server]
    environment:
      ROLE: client
      MODE: kernel
      TUN_ADDR: 10.7.0.2/24
      URL: ws://server:8080
      PSK: "${RIPWS_PSK}"
      UUID: "${RIPWS_UUID}"
      PING_INTERVAL: "30"
    restart: "no"

networks:
  ripws-net:
    driver: bridge
